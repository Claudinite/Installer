# Publishes the version package.json names to npm, with provenance, through
# npm's trusted publishing for this workflow; no token is stored. A version
# already on npm is refused, since every version a workflow names must stay
# the code it was.
name: release
on:
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
concurrency: release
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11.21.0
      - run: node --test
      - name: Refuse a version already published
        run: |
          version=$(node -p 'require("./package.json").version')
          if npm view "@claudinite/setup@$version" version 2>/dev/null | grep -q .; then
            echo "@claudinite/setup@$version is already on npm; raise the version in package.json" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - run: npm publish --access public --provenance
      - run: |
          git tag "v$VERSION"
          git push origin "v$VERSION"
